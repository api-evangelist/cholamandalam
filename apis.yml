description: 'Cholamandalam Investment and Finance Company (Chola) is an Indian non-banking financial
  company (NBFC) headquartered in Chennai and part of the Murugappa Group (CIN L65993TN1978PLC007576).
  It provides lending across vehicle finance (commercial vehicles, cars, two-wheelers, three-wheelers,
  tractors and construction equipment), home loans and loan against property, SME/MSME and business
  loans, supply chain finance, gold loans, and consumer and personal loans through a branch network
  across India. No public developer portal, API documentation, or SDKs were found during enrichment;
  the company operates consumer/branch and mobile-app (Chola One) channels rather than a published
  developer program. Group affiliates include Chola Securities and the Gaadi Bazaar vehicle marketplace.'
